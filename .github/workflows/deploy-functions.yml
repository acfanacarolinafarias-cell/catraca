# Publica as Edge Functions (pagamento) no Supabase sempre que elas mudam na branch main.
# Requer o segredo SUPABASE_ACCESS_TOKEN no GitHub (Settings > Secrets and variables > Actions).
name: Publicar funções no Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: xfrbybveoschauaaxmbk
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Conferir o segredo
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN no GitHub (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Publicar checkout e payment-webhook
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
