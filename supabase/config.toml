# Configuração usada pelo deploy das Edge Functions (GitHub Actions).
project_id = "catraca"

# As duas funções conferem a identidade por conta própria:
# checkout valida a sessão do comprador; payment-webhook valida o código secreto do Asaas.
[functions.checkout]
verify_jwt = false

[functions.payment-webhook]
verify_jwt = false

# Vence reservas e cancela cobranças abertas; chamada pelo agendamento do banco (supabase/cron.sql).
[functions.expire-orders]
verify_jwt = false
